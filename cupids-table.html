<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cupid's 21</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;width:100vw;height:100vh;overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" src="eros.mp4" playsinline preload="auto" style="display:none"></video>
<img id="ea" src="eros-angry.png" style="display:none">
<img id="ew" src="eros-win.png"  style="display:none">
<img id="ei" src="eros-idle.png" style="display:none">
<script>
// CUPID'S 21 — POV edition — BioCraftEd Jam 2026
const C=document.getElementById('c'),ctx=C.getContext('2d');
const LW=480,LH=270;
C.width=LW;C.height=LH;
ctx.imageSmoothingEnabled=false;
function resize(){const s=Math.min(innerWidth/LW,innerHeight/LH);C.style.width=LW*s+'px';C.style.height=LH*s+'px';C._s=s;}
addEventListener('resize',resize);resize();

// ── PIXEL ART VIDEO ENGINE ────────────────────────────────────────
// Video is 1280×720 (16:9), 5s. We render to a tiny offscreen canvas
// then scale up with imageSmoothingEnabled=false for chunky pixel art.
const VID=document.getElementById('v');
// Offscreen canvas: 80×45 (exactly 16:9 at 4× = 320×180 on screen)
const PV=document.createElement('canvas'); PV.width=80; PV.height=45;
const PVC=PV.getContext('2d',{willReadFrequently:true});

// 24-color palette: game purple theme + skin tones for the video character
const PAL=[
  [6,0,14],[16,0,30],[26,3,48],[34,0,85],[55,0,120],
  [85,0,170],[136,34,204],[170,68,255],[204,136,255],
  [255,68,119],[255,136,204],[255,180,220],
  [255,215,0],[255,240,120],[200,160,40],
  [255,255,255],[180,160,200],[100,80,140],
  [200,136,80],[168,96,48],[120,60,20],[80,30,10],
  [26,8,0],[0,0,0],
];
function nearP(r,g,b){
  let bi=0,bd=Infinity;
  for(let i=0;i<PAL.length;i++){
    const d=(r-PAL[i][0])**2+(g-PAL[i][1])**2+(b-PAL[i][2])**2;
    if(d<bd){bd=d;bi=i;}
  }
  return PAL[bi];
}

let vidReady=false, vidEnded=false, _qFrame=0;
VID.addEventListener('canplaythrough',()=>vidReady=true);
VID.addEventListener('ended',()=>{vidEnded=true; if(G&&G.phase==='intro') G.phase='menu';});
VID.addEventListener('error',()=>{ vidReady=false; if(G&&G.phase==='intro') G.phase='menu'; });

function renderVidPixel(dx,dy,dw,dh){
  if(!vidReady||VID.readyState<2) return false;
  // Draw video frame → tiny canvas
  PVC.drawImage(VID,0,0,80,45);
  // Palette-quantize every frame (80×45=3600 px, fast enough)
  _qFrame++;
  if(_qFrame%2===0){ // quantize every other frame
    const id=PVC.getImageData(0,0,80,45),d=id.data;
    for(let i=0;i<d.length;i+=4){
      const[r,g,b]=nearP(d[i],d[i+1],d[i+2]);
      d[i]=r;d[i+1]=g;d[i+2]=b;
    }
    PVC.putImageData(id,0,0);
  }
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(PV,dx,dy,dw,dh);
  ctx.imageSmoothingEnabled=false;
  return true;
}

function startVideo(){
  // Hard fallback: if video doesn't end within 8s, skip to menu
  const bail=setTimeout(()=>{if(G&&G.phase==='intro')G.phase='menu';},8000);
  VID.addEventListener('ended',()=>clearTimeout(bail),{once:true});
  VID.addEventListener('error',()=>{clearTimeout(bail);if(G&&G.phase==='intro')G.phase='menu';},{once:true});
  const tryPlay=()=>VID.play().catch(()=>{if(G&&G.phase==='intro')G.phase='menu';});
  if(VID.readyState>=3){VID.currentTime=0;tryPlay();}
  else{VID.addEventListener('canplaythrough',()=>{VID.currentTime=0;tryPlay();},{once:true});}
}

// ── EROS PORTRAIT SPRITES ─────────────────────────────────────────
// Pixel art via two-step scale: img → tiny canvas (55×35) → main canvas 4× up.
// No getImageData/putImageData = no cross-origin/security issues on file://
const EA_EL=document.getElementById('ea');
const EW_EL=document.getElementById('ew');
const EI_EL=document.getElementById('ei');
// Tiny staging canvas used only for the downscale step
// Staging canvas: 80×27 → upscaled 6× to ~480×162 = chunky 6px blocks
const PSTAGE=document.createElement('canvas');PSTAGE.width=80;PSTAGE.height=27;
const PSTC=PSTAGE.getContext('2d');

function blitEros(imgEl,dx,dy,dw,dh){
  const sw=imgEl.naturalWidth||1280, sh=imgEl.naturalHeight||720;
  PSTC.imageSmoothingEnabled=true;
  PSTC.clearRect(0,0,80,27);
  // Centered crop: trim 10% from each side horizontally to focus on face
  PSTC.drawImage(imgEl, sw*0.1, 0, sw*0.8, sh, 0, 0, 80, 27);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(PSTAGE, dx, dy, dw, dh);
  ctx.imageSmoothingEnabled=false;
}

// ── AUDIO ─────────────────────────────────────────────────────────
let AC=null;
function initAC(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f,type,dur,vol=0.25,sweep=null,delay=0){
  if(!AC)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type=type;
  o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(sweep,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur);
}
function noise(dur,vol=0.18,delay=0){
  if(!AC)return;const t=AC.currentTime+delay;
  const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();
  s.buffer=buf;fl.type='bandpass';fl.frequency.value=1600;
  s.connect(fl);fl.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.start(t);s.stop(t+dur);
}
function snd(id){
  initAC();
  if(id==='card')   {tone(750,'triangle',.07,.18,280);}
  if(id==='ugh')    {noise(.07,.22);tone(210,'sawtooth',.38,.24,52);}
  if(id==='ah')     {[380,560,720,900].forEach((f,i)=>tone(f,'sine',.15,.18,null,i*.08));}
  if(id==='whoosh') {noise(.32,.2);tone(480,'sawtooth',.32,.07,75);}
  if(id==='wild')   {[360,460,600,780].forEach((f,i)=>tone(f,'sine',.13,.2,null,i*.08));}
  if(id==='bust')   {tone(260,'sawtooth',.48,.22,42);}
  if(id==='win')    {[480,640,800,1000].forEach((f,i)=>tone(f,'sine',.2,.2,null,i*.07));}
  if(id==='tick')   {tone(880,'square',.04,.08);}
}

// ── FONT 4×6 ─────────────────────────────────────────────────────
const BF={'0':[6,9,9,9,9,6],'1':[2,6,2,2,2,7],'2':[6,9,1,2,4,15],'3':[6,9,3,1,9,6],'4':[1,3,5,9,15,1],'5':[15,8,14,1,9,6],'6':[6,8,14,9,9,6],'7':[15,1,2,4,4,4],'8':[6,9,6,9,9,6],'9':[6,9,9,7,1,6],'A':[6,9,15,9,9,9],'B':[14,9,14,9,9,14],'C':[6,9,8,8,9,6],'D':[14,9,9,9,9,14],'E':[15,8,14,8,8,15],'F':[15,8,14,8,8,8],'G':[6,9,8,11,9,6],'H':[9,9,15,9,9,9],'I':[7,2,2,2,2,7],'J':[1,1,1,1,9,6],'K':[9,10,12,10,9,9],'L':[8,8,8,8,8,15],'M':[9,15,15,9,9,9],'N':[9,13,11,9,9,9],'O':[6,9,9,9,9,6],'P':[14,9,9,14,8,8],'Q':[6,9,9,11,9,7],'R':[14,9,14,10,9,9],'S':[7,8,6,1,1,14],'T':[15,2,2,2,2,2],'U':[9,9,9,9,9,6],'V':[9,9,9,9,6,6],'W':[9,9,9,15,15,9],'X':[9,6,6,6,6,9],'Y':[9,9,6,2,2,2],'Z':[15,1,2,4,8,15],' ':[0,0,0,0,0,0],'!':[2,2,2,2,0,2],'.':[0,0,0,0,0,2],':':[0,2,0,0,2,0],'+':[0,2,7,2,0,0],'-':[0,0,7,0,0,0],'>':[4,2,1,1,2,4],'=':[0,15,0,15,0,0],'?':[6,9,2,2,0,2],"'":[2,2,0,0,0,0],'/':[1,1,2,2,4,4],'*':[0,5,2,5,0,0],'#':[5,15,5,5,15,5]};
function pc(ch,x,y,col,sc=1){const r=BF[ch.toUpperCase()]||BF[' '];ctx.fillStyle=col;r.forEach((v,dy)=>{for(let dx=0;dx<4;dx++)if(v&(1<<(3-dx)))ctx.fillRect(x+dx*sc,y+dy*sc,sc,sc);});}
function pt(s,x,y,col,sc=1){[...s].forEach((c,i)=>pc(c,x+i*5*sc,y,col,sc));}
function ptw(s,sc=1){return s.length*5*sc;}
function ptc(s,cx,y,col,sc=1){pt(s,Math.round(cx-ptw(s,sc)/2),y,col,sc);}

// ── UTILS ─────────────────────────────────────────────────────────
function pbord(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);}
function fillR(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}
function pbtn(lbl,x,y,w,h,hov,col='#3d0077'){
  fillR(x,y,w,h,'#060010');fillR(x+1,y+1,w-2,h-2,hov?lc(col):col);
  pbord(x,y,w,h,hov?'#ffdd00':'#7700cc');
  ptc(lbl,x+w/2,y+(h-6)/2|0,hov?'#ffee88':'#ddbbff',1);
}
function lc(c){const m={'#3d0077':'#5500bb','#550022':'#880033','#005533':'#008844'};return m[c]||'#6600cc';}

// ── BIG EROS POV SPRITE ───────────────────────────────────────────
function drawEros(st,sf){
  const cx=240;
  const bob=(st==='idle'||st==='think'||st==='draw')?Math.round(Math.sin(G.frame*.055)*2):0;
  const recoil=st==='hit'?-(Math.min(sf*.6,10)|0):0;
  const lean=st==='win'?Math.max(0,5-sf*.12)|0:0;
  const oy=bob+recoil+lean;
  const EPH=TY+2; // portrait fills canvas to table edge

  if(st==='hit'){
    const shk=Math.round(Math.sin(G.frame*1.6)*5);
    const pulse=(Math.abs(Math.sin(G.frame*.28))*8)|0;
    // Full-width rage aura rings
    for(let r=0;r<4;r++){
      const exp=pulse+r*6,a=.5-r*.1;
      ctx.strokeStyle=`rgba(255,${r*30},0,${a})`;ctx.lineWidth=3;
      ctx.strokeRect(-exp+shk,oy-exp,LW+exp*2,EPH+exp*2);
    }
    if(EA_EL.naturalWidth){blitEros(EA_EL,shk,oy,LW,EPH);}
    else{fillR(0,oy,LW,EPH,'#2a0000');}
    if(G.frame%8<4){ctx.fillStyle='rgba(220,0,0,.18)';ctx.fillRect(shk,oy,LW,EPH);}
    ctx.fillStyle='rgba(0,0,0,.2)';
    for(let sy=oy;sy<oy+EPH;sy+=2)ctx.fillRect(shk,sy,LW,1);

  } else if(st==='win'){
    const bounce=Math.round(Math.sin(G.frame*.18)*4);
    const grow=(Math.abs(Math.sin(G.frame*.13))*6)|0;
    const ga=.3+Math.abs(Math.sin(G.frame*.3))*.5;
    ctx.strokeStyle=`rgba(255,215,0,${ga})`;ctx.lineWidth=3;
    ctx.strokeRect(-4,oy-4+bounce,LW+8,EPH+8);
    if(EW_EL.naturalWidth){blitEros(EW_EL,-(grow/2|0),oy+bounce-(grow/2|0),LW+grow,EPH+grow);}
    else{fillR(0,oy,LW,EPH,'#1a0800');}
    const sh=(G.frame%30)/30;
    ctx.fillStyle=`rgba(255,200,0,${sh*.07})`;ctx.fillRect(0,oy+bounce,LW,EPH);
    ctx.fillStyle='rgba(0,0,0,.18)';
    for(let sy=oy+bounce;sy<oy+bounce+EPH;sy+=2)ctx.fillRect(0,sy,LW,1);
    ptc('HA  HA  HA',cx,TY-12,'#ffd700',1);

  } else {
    if(EI_EL.naturalWidth){
      const breathe=Math.sin(G.frame*.04)*.5+.5;
      const grow=(breathe*4)|0;
      blitEros(EI_EL,-(grow/2|0),oy-(grow/2|0),LW+grow,EPH+grow);
      ctx.fillStyle='rgba(0,0,0,.12)';
      for(let sy=oy;sy<oy+EPH;sy+=2)ctx.fillRect(0,sy,LW,1);
    } else {
      fillR(0,oy,LW,EPH,'#120020');
    }
    if(st==='think'){
      const dots='.'.repeat(1+(G.frame/20|0)%3+1);
      ptc(dots,cx,TY-12,'#ff88cc',1);
    }
  }

  // Dark fade at bottom of portrait to blend into table
  for(let i=0;i<28;i++){
    ctx.fillStyle=`rgba(0,0,0,${(i/28)*.85})`;
    ctx.fillRect(0,EPH-28+i,LW,1);
  }
}

// ── CARDS ─────────────────────────────────────────────────────────
// v: 1=A 2-10 11=J 12=Q 13=K  wilds: 14=+5CURSE 15=SWAP 16=SHIELD 17=STEAL 18=PEEK
const WNAME={14:'+5',15:'SWAP',16:'SHLD',17:'STEAL',18:'PEEK'};
const WCOL={14:'#ff4444',15:'#44aaff',16:'#44ff88',17:'#ffaa44',18:'#ff44ff'};
const SCOL=['#cc1133','#cc1133','#223399','#115522']; // ♥red ♦red ♠navy ♣green

function cval(c){if(c.wild)return 0;if(c.v>=11)return 10;return c.v;}
function clabel(c){if(c.wild)return WNAME[c.v];if(c.v===1)return'A';if(c.v===11)return'J';if(c.v===12)return'Q';if(c.v===13)return'K';return''+c.v;}

// Pixel suit symbols 5×5
const SUITPX={0:[0b01010,0b11111,0b11111,0b01110,0b00100],1:[0b00100,0b01110,0b11111,0b01110,0b00100],2:[0b00100,0b01110,0b11111,0b00100,0b01110],3:[0b01110,0b11111,0b01110,0b00100,0b01110]};
function drawSuit(sx,sy,suit,col,sc=1){
  ctx.fillStyle=col;
  (SUITPX[suit%4]||SUITPX[0]).forEach((row,r)=>{for(let b=4;b>=0;b--){if(row&(1<<b))ctx.fillRect(sx+(4-b)*sc,sy+r*sc,sc,sc);}});
}

// Small card — Eros side (22×30)
const SCW=22,SCH=30;
function drawSmCard(x,y,c,face=false){
  if(!face){
    fillR(x,y,SCW,SCH,'#14002c');pbord(x,y,SCW,SCH,'#7700cc');
    fillR(x+2,y+2,SCW-4,SCH-4,'#1e0040');
    for(let i=3;i<SCW-3;i+=4)fillR(x+i,y+3,1,SCH-6,'#330066');
    fillR(x+SCW/2-3,y+SCH/2-3,6,6,'#4400aa');pbord(x+SCW/2-3,y+SCH/2-3,6,6,'#aa00ff');
    return;
  }
  const wld=c.wild,suit=c.suit%4,col=wld?WCOL[c.v]:SCOL[suit];
  if(wld){
    fillR(x,y,SCW,SCH,'#0c001a');pbord(x,y,SCW,SCH,col);
    fillR(x+1,y+1,SCW-2,2,col);fillR(x+1,y+SCH-3,SCW-2,2,col);
    ptc(WNAME[c.v],x+SCW/2,y+5,col,1);ptc('WLD',x+SCW/2,y+16,'#ddddff',1);
  } else {
    fillR(x,y,SCW,SCH,'#f2e8ff');pbord(x,y,SCW,SCH,col);
    fillR(x+1,y+1,SCW-2,SCH-2,'#faf4ff');
    pt(clabel(c),x+2,y+2,col,1);
    drawSuit(x+SCW/2-4,y+SCH/2-3,suit,col,2);
  }
}

// Large card — player hand (40×56)
const LCW=40,LCH=56;
function drawLgCard(x,y,c,hov=false){
  const wld=c.wild,suit=c.suit%4,col=wld?WCOL[c.v]:SCOL[suit];
  if(wld){
    fillR(x,y,LCW,LCH,'#0c0020');pbord(x,y,LCW,LCH,col);
    if(G.frame%14<7)pbord(x+1,y+1,LCW-2,LCH-2,col);
    fillR(x+2,y+2,LCW-4,4,col);fillR(x+2,y+LCH-6,LCW-4,4,col);
    ptc(WNAME[c.v],x+LCW/2,y+10,col,2);
    ptc('WILD CARD',x+LCW/2,y+30,'#ffffff',1);
  } else {
    fillR(x,y,LCW,LCH,'#f0e6ff');pbord(x,y,LCW,LCH,col);
    fillR(x+1,y+1,LCW-2,LCH-2,'#faf4ff');
    if(hov){pbord(x+1,y+1,LCW-2,LCH-2,'#ffd700');}
    // Thin inner frame
    ctx.strokeStyle=col+'55';ctx.lineWidth=1;ctx.strokeRect(x+3,y+3,LCW-6,LCH-6);
    const lbl=clabel(c);
    pt(lbl,x+2,y+2,col,1); // top-left label
    drawSuit(x+3,y+8,suit,col,1); // top-left suit
    // Centre: large suit + big value
    drawSuit(x+LCW/2-6,y+LCH/2-12,suit,col,3);
    ptc(lbl,x+LCW/2,y+LCH/2+8,col,lbl.length>1?1:2);
  }
}

// ── PARTICLES ─────────────────────────────────────────────────────
let PTS=[];
function spark(x,y,n=8,col='#ff4488'){for(let i=0;i<n;i++)PTS.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-2,life:1,dec:.02+Math.random()*.02,col,sz:Math.random()>.5?2:1});}
function tickPts(){PTS=PTS.filter(p=>p.life>0);PTS.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.life-=p.dec;});}
function drawPts(){PTS.forEach(p=>{ctx.fillStyle=p.col;ctx.globalAlpha=p.life;ctx.fillRect(p.x|0,p.y|0,p.sz,p.sz);});ctx.globalAlpha=1;}
let FLT=[];
function flt(t,x,y,col,sc=1){FLT.push({t,x,y:y|0,col,sc,life:100});}
function tickFlt(){FLT=FLT.filter(f=>f.life>0);FLT.forEach(f=>{f.y-=.5;f.life--;});}
function drawFlt(){FLT.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life/18);ptc(f.t,f.x|0,f.y|0,f.col,f.sc);});ctx.globalAlpha=1;}

// ── ARROW ANIMATIONS ──────────────────────────────────────────────
let ARW=null; // {t, fromRight, done}
let screenShake=0;

function fireArrow(fromRight){ARW={t:0,fromRight,done:false};snd('whoosh');}

function tickArrow(){
  if(!ARW||ARW.done)return;
  ARW.t+=0.026;
  if(ARW.t>=1){
    ARW.done=true;
    if(ARW.fromRight){
      snd('ugh');screenShake=20;spark(LW/2,LH/2,24,'#ff4444');spark(LW/2,LH/2,12,'#ffaa00');
      G.pState='hit';G.pStateF=0;G.stuckP.push({angle:(Math.random()-.5)*.4});
    } else {
      // Arrow hits Eros: flash + sparks, then disappear (no stuck arrow stays)
      snd('ugh');
      spark(LW/2,TY/2,28,'#ff4444');spark(LW/2,TY/2,14,'#ffaa00');spark(LW/2,TY/2,8,'#ffffff');
      screenShake=12;
      G.oState='hit';G.oStateF=0;
      // No stuckO push — arrow vanishes on impact
    }
    setTimeout(()=>{
      if(G.pLives<=0||G.oLives<=0)G.phase='gameover';
      else initRound();
    },1300);
    return;
  }
}

// Incoming arrow toward camera (from Eros): grows bigger
function drawIncomingArrow(t){
  const ease=t*t; // accelerate
  const sz=Math.round(ease*90);
  const x=LW/2, y=Math.round(130+ease*80);
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#885522';ctx.fillRect(-sz/2|0,-2,sz,5); // shaft
  ctx.fillStyle='#ccaa55';ctx.fillRect(-sz/2|0,-1,sz,2); // highlight
  // tip (diamond pointing at us)
  ctx.fillStyle='#bbbbbb';ctx.fillRect(-5,-5,10,10);
  ctx.fillStyle='#888888';ctx.fillRect(-3,-7,6,4);ctx.fillRect(-7,-3,4,6);ctx.fillRect(3,-3,4,6);ctx.fillRect(-3,3,6,4);
  ctx.fillStyle='#dddddd';ctx.fillRect(-2,-2,4,4);
  // fletching
  ctx.fillStyle='#ff3344';ctx.fillRect(sz/2|0-8,-8,10,16);ctx.fillStyle='#cc1122';ctx.fillRect(sz/2|0-8,-8,3,16);
  ctx.restore();
}

// Outgoing arrow from player toward Eros: shrinks as it flies up
function drawOutgoingArrow(t){
  const ease=1-Math.pow(1-t,2);
  const sz=Math.round((1-ease)*60+4);
  const x=LW/2, y=Math.round(LH-30-ease*(LH-30-TY/2));
  ctx.save();ctx.translate(x,y);ctx.rotate(-0.05);
  ctx.fillStyle='#885522';ctx.fillRect(-sz/2|0,-2,sz,4);
  ctx.fillStyle='#aaaaaa';ctx.fillRect(sz/2|0,-3,5,5);
  ctx.fillStyle='#ff3344';ctx.fillRect(-sz/2|0-5,-5,6,10);
  ctx.restore();
}

// Stuck arrows on player (HUD, shown as arrow icons)
function drawStuckOnPlayer(){
  G.stuckP.forEach((a,i)=>{
    const x=20+i*22,y=LH-24;
    ctx.save();ctx.translate(x,y);ctx.rotate(a.angle||0);
    fillR(-10,-1,20,3,'#885522');fillR(8,-2,4,4,'#aaaaaa');fillR(-12,-4,4,8,'#ff3344');
    ctx.restore();
  });
}

// Stuck arrows on Eros (drawn on top of Eros sprite)
function drawStuckOnEros(){
  G.stuckO.forEach(a=>{
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(.15+(Math.random()*.1-.05));
    fillR(-12,-1,24,3,'#885522');fillR(10,-2,4,4,'#aaaaaa');fillR(-14,-4,4,8,'#ff3344');
    ctx.restore();
  });
}

// ── ROOM BACKGROUND ───────────────────────────────────────────────
const TY=155; // table far edge y

// Pre-sampled edge colours from Eros photos (eyedropped dark warm scene bg)
const BG_COLS=['#120800','#160a02','#1a0c02','#180b01','#140900','#0f0600','#0c0400'];
function drawRoom(){
  // Fill with dark warm tone matching Eros's photo bg
  fillR(0,0,LW,LH,'#120800');

  // Pixel art background texture — 6×6 blocks continuing the scene
  for(let ty=0;ty<TY;ty+=6){
    for(let tx=0;tx<LW;tx+=6){
      const ci=(tx/6+ty/6)%BG_COLS.length;
      const v=Math.round(Math.sin(tx*.07+ty*.05)*3);
      ctx.fillStyle=BG_COLS[(ci+v+BG_COLS.length)%BG_COLS.length];
      ctx.fillRect(tx,ty,6,6);
    }
  }
  // Dark warm vignette toward portrait center (so Eros stands out)
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.fillRect(0,0,40,TY); ctx.fillRect(LW-40,0,40,TY);
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.fillRect(0,0,LW,12); // top shadow

  // TABLE SURFACE — warm dark wood grain
  for(let y=TY;y<LH;y++){
    const t=(y-TY)/(LH-TY);
    const x1=Math.round(80*(1-t)),x2=Math.round(LW-80*(1-t));
    ctx.fillStyle=y%6===0?'#1e0e06':y%3===0?'#190b04':'#150904';
    ctx.fillRect(x1,y,x2-x1,1);
  }
  // Table far edge — warm gold glint
  fillR(0,TY,LW,2,'#2a1000');
  fillR(4,TY,LW-8,1,'#c89030');
  fillR(8,TY,LW-16,1,'#ffd700');
  ctx.fillStyle='rgba(255,180,50,.07)';ctx.fillRect(60,TY-6,360,8);
  // Perspective edge lines
  ctx.fillStyle='#1e0a00';
  for(let y=TY+2;y<LH;y+=2){
    const t=(y-TY)/(LH-TY),x1=Math.round(80*(1-t)),x2=Math.round(LW-80*(1-t));
    ctx.fillRect(x1,y,2,1); ctx.fillRect(x2-2,y,2,1);
  }
  fillR(0,LH-3,LW,3,'#1a0800');
}

function drawTorch(tx,ty){
  // Bracket
  fillR(tx-3,ty+10,6,16,'#3a3030');fillR(tx-1,ty+6,2,4,'#3a3030');
  fillR(tx-5,ty+14,10,4,'#4a3030');
  // Candle
  fillR(tx-3,ty,6,12,'#ddddaa');fillR(tx-2,ty,4,10,'#eeeebb');
  // Wick
  fillR(tx-1,ty-3,2,3,'#333333');
  // Animated flame
  const flk=Math.sin(G.frame*.18+tx)*.5;
  const fx=tx+flk|0;
  fillR(fx-4,ty-12,8,10,'#ffcc00');fillR(fx-3,ty-15,6,7,'#ff8800');
  fillR(fx-2,ty-17,4,5,'#ff4400');fillR(fx-1,ty-18,2,4,'#ffffff');
  // Glow on wall
  ctx.fillStyle='rgba(255,160,0,.06)';ctx.fillRect(tx-20,ty-20,40,40);
}

// ── DECK + SCORING ────────────────────────────────────────────────
function mkDeck(){
  const d=[];for(let s=0;s<4;s++)for(let v=1;v<=13;v++)d.push({v,suit:s,wild:false});
  [14,15,16,17,18,14,15,16].forEach(v=>d.push({v,suit:0,wild:true}));
  return shuf(d);
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function total(hand){
  let t=0,ac=0;
  hand.forEach(c=>{if(c.wild||c.ghost)return;if(c.v===1){t+=11;ac++;}else t+=cval(c);});
  while(t>21&&ac>0){t-=10;ac--;}return t;
}

// ── WILD EFFECTS ──────────────────────────────────────────────────
const WFULL={14:'+5 CURSE!',15:'HANDS SWAPPED!',16:'SHIELDED!',17:'CARD STOLEN!',18:'PEEK!'};
function applyWild(c,forP){
  snd('wild');G.wildFlash={col:WCOL[c.v],t:35};
  flt(WFULL[c.v]||'WILD!',LW/2,LH/2-20,WCOL[c.v],1);spark(LW/2,LH/2,14,WCOL[c.v]);
  const v=c.v;
  if(v===14){if(forP){flt('EROS +5!',LW/2,120,'#ff4444',1);G.oHand.push({v:5,suit:0,wild:false,ghost:true});}else{flt('YOU +5!',LW/2,220,'#ff4444',1);G.pHand.push({v:5,suit:0,wild:false,ghost:true});}}
  if(v===15){const tmp=G.pHand;G.pHand=G.oHand;G.oHand=tmp;}
  if(v===16){if(forP)G.pShield=true;else G.oShield=true;}
  if(v===17){if(forP&&G.oHand.length>0)G.pHand.push(G.oHand.pop());else if(!forP&&G.pHand.length>0)G.oHand.push(G.pHand.pop());}
  if(v===18){flt('EROS HAS '+total(G.oHand)+'!',LW/2,LH/2,'#ff44ff',1);}
}

// ── GAME STATE ────────────────────────────────────────────────────
let G={phase:'intro',vidStarted:false,deck:[],pHand:[],oHand:[],pLives:3,oLives:3,pShield:false,oShield:false,pState:'idle',pStateF:0,oState:'idle',oStateF:0,stuckP:[],stuckO:[],oppTimer:0,msg:'',msgT:0,frame:0,hBtn:null,wildFlash:null};
function setMsg(m,t=130){G.msg=m;G.msgT=t;}

function initRound(){
  G.deck=mkDeck();G.pHand=[];G.oHand=[];G.pShield=false;G.oShield=false;
  G.msg='';G.msgT=0;G.wildFlash=null;FLT=[];ARW=null;
  G.pState='idle';G.oState='idle';G.pStateF=0;G.oStateF=0;
  const pc=G.deck.pop(),oc=G.deck.pop();
  G.pHand.push(pc);G.oHand.push(oc);snd('card');
  if(pc.wild)setTimeout(()=>applyWild(pc,true),300);
  if(oc.wild)setTimeout(()=>applyWild(oc,false),600);
  G.phase='player';
}
function newGame(){G.pLives=3;G.oLives=3;G.stuckP=[];G.stuckO=[];PTS=[];FLT=[];ARW=null;initRound();}

// ── PLAYER ACTIONS ────────────────────────────────────────────────
function actDraw(){
  if(G.phase!=='player')return;
  const c=G.deck.pop();if(!c)return;
  G.pHand.push(c);snd('card');G.pState='idle';
  spark(LW/2,195,6,'#aa44ff');
  if(c.wild){setTimeout(()=>applyWild(c,true),200);return;}
  const t=total(G.pHand);
  if(t>21){
    if(G.pShield){G.pShield=false;flt('SHIELD SAVES YOU!',LW/2,200,'#44ff88',1);return;}
    snd('bust');setMsg('BUST! '+t);G.pState='hit';G.pStateF=0;
    setTimeout(resolveRound,800);
  } else if(t===21){snd('win');setMsg('21! PERFECT!');setTimeout(resolveRound,600);}
}
function actStand(){if(G.phase!=='player')return;G.phase='opp';G.oppTimer=55;G.oState='think';}

// ── OPPONENT AI ───────────────────────────────────────────────────
function oppTick(){
  if(G.phase!=='opp')return;
  if(G.oppTimer>0){G.oppTimer--;return;}
  const ot=total(G.oHand),pt=total(G.pHand);
  if(ot<17||(ot<=pt&&ot<20)){
    const c=G.deck.pop();if(!c){resolveRound();return;}
    G.oHand.push(c);snd('card');G.oState='draw';G.oStateF=0;
    if(c.wild)applyWild(c,false);
    const nt=total(G.oHand);
    G.oppTimer=38;
    if(nt>21){if(G.oShield){G.oShield=false;return;}snd('win');setMsg('EROS BUSTS!');setTimeout(resolveRound,700);}
    else if(nt===21){setTimeout(resolveRound,500);}
  } else {G.oState='idle';resolveRound();}
}

// ── RESOLVE ROUND ─────────────────────────────────────────────────
function resolveRound(){
  if(G.phase==='resolve'||G.phase==='gameover')return;
  G.phase='resolve';
  const pt=total(G.pHand),ot=total(G.oHand);
  let w=pt>21?'o':ot>21?'p':pt>ot?'p':ot>pt?'o':'tie';
  if(w==='p'){
    G.oLives--;snd('win');G.pState='win';G.pStateF=0;G.oState='hit';G.oStateF=0;
    setMsg('ROUND WON!');spark(LW/2,200,22,'#ffd700');
    setTimeout(()=>fireArrow(false),800); // outgoing arrow toward Eros
  } else if(w==='o'){
    G.pLives--;snd('ugh');G.pState='hit';G.pStateF=0;G.oState='win';G.oStateF=0;
    setMsg('EROS WINS ROUND');
    setTimeout(()=>fireArrow(true),800);  // incoming arrow toward player
  } else {
    setMsg('TIE! NO ARROWS');setTimeout(initRound,1400);
  }
}

// ── DRAW HANDS ────────────────────────────────────────────────────
function drawHands(){
  const reveal=G.phase==='resolve'||G.phase==='gameover';

  // Eros cards (small, on far side of table)
  const on=G.oHand.length;
  const osx=LW/2-on*(SCW+3)/2;
  G.oHand.forEach((c,i)=>drawSmCard(osx+i*(SCW+3),TY+4,c,reveal&&!c.ghost));
  if(reveal){
    const ot=total(G.oHand);
    ptc(ot>21?'BUST!':'EROS: '+ot,LW/2,TY+SCH+8,ot>21?'#ff4444':'#cc88ff',1);
  } else {ptc('EROS: ???',LW/2,TY+SCH+8,'#554466',1);}

  // Deck pile
  const dy=TY+SCH/2+2;
  if(G.deck.length>1){drawSmCard(LW/2-SCW/2+2,dy+1,null,false);}
  if(G.deck.length>0){drawSmCard(LW/2-SCW/2,dy,null,false);}
  ptc(G.deck.length+'',LW/2,dy+SCH+3,'#554466',1);

  // Player cards (large, close up, bottom)
  const pn=G.pHand.length;
  const psx=LW/2-pn*(LCW+3)/2;
  const pcy=TY+SCH+16;
  G.pHand.forEach((c,i)=>!c.ghost&&drawLgCard(psx+i*(LCW+3),pcy,c));
  const pt=total(G.pHand);
  const pc2=pt>21?'#ff4444':pt===21?'#ffd700':'#ff88cc';
  ptc(pt>21?'BUST!':pt===21?'21!':('YOU: '+pt),LW/2,pcy+LCH+3,pc2,pt===21?2:1);
}

// ── LIVES + HUD ───────────────────────────────────────────────────
function heart(x,y,col){ctx.fillStyle=col;ctx.fillRect(x+1,y,2,1);ctx.fillRect(x+5,y,2,1);ctx.fillRect(x,y+1,8,1);ctx.fillRect(x,y+2,8,1);ctx.fillRect(x+1,y+3,6,1);ctx.fillRect(x+2,y+4,4,1);ctx.fillRect(x+3,y+5,2,1);}

function drawHUD(){
  // Eros lives (top left, small)
  ptc('EROS',28,2,'#aa44ff',1);
  for(let i=0;i<3;i++)heart(2+i*12,9,i<G.oLives?'#aa44ff':'#220033');
  if(G.oShield){fillR(2,18,42,7,'#002200');pbord(2,18,42,7,'#44ff88');ptc('SHLD',23,19,'#44ff88',1);}

  // Player lives (top right, small)
  ptc('YOU',LW-28,2,'#ff4477',1);
  for(let i=0;i<3;i++)heart(LW-38+i*12,9,i<G.pLives?'#ff4477':'#330011');
  if(G.pShield){fillR(LW-44,18,42,7,'#002200');pbord(LW-44,18,42,7,'#44ff88');ptc('SHLD',LW-23,19,'#44ff88',1);}

  // Status bar (bottom) — no text, just buttons area
  fillR(0,LH-14,LW,14,'#08000f');
  if(G.phase==='opp')ptc('EROS IS THINKING...',LW/2,LH-11,'#aa44ff',1);
  if(G.phase==='resolve')ptc('ROUND OVER',LW/2,LH-11,'#ffd700',1);

  // Message (center screen)
  if(G.msgT>0){
    ctx.globalAlpha=Math.min(1,G.msgT/20);
    ptc(G.msg,LW/2,210,'#ff88cc',1);
    ctx.globalAlpha=1;
  }

  // Wild flash overlay
  if(G.wildFlash&&G.wildFlash.t>0){
    ctx.globalAlpha=G.wildFlash.t/35*.35;ctx.fillStyle=G.wildFlash.col;ctx.fillRect(0,0,LW,LH);
    ctx.globalAlpha=1;G.wildFlash.t--;
  }
}

// ── BUTTONS ──────────────────────────────────────────────────────
function getBtns(){
  if(G.phase!=='player')return[];
  return[{id:'draw',label:'DRAW',x:LW/2-62,y:LH-13,w:56,h:12,col:'#3d0077'},{id:'stand',label:'STAND',x:LW/2+6,y:LH-13,w:56,h:12,col:'#550022'}];
}
function btnAt(mx,my){
  if(G.phase==='intro'   &&mx>=LW-68&&mx<LW-6&&my>=LH-14&&my<LH-2)return'skip';
  if(G.phase==='menu'    &&mx>=LW/2-55&&mx<LW/2+55&&my>=TY+48&&my<TY+62)return'start';
  if(G.phase==='gameover'&&mx>=LW/2-55&&mx<LW/2+55&&my>=TY+48&&my<TY+62)return'restart';
  for(const b of getBtns())if(mx>=b.x&&mx<b.x+b.w&&my>=b.y&&my<b.y+b.h)return b.id;
  return null;
}

// ── INTRO CUTSCENE ────────────────────────────────────────────────
function drawIntro(){
  ctx.fillStyle='#06000e';ctx.fillRect(0,0,LW,LH);
  // Video at 320×180 centered on canvas, pixel art upscaled
  const vx=80,vy=35,vw=320,vh=180;
  const got=renderVidPixel(vx,vy,vw,vh);
  if(!got){
    ctx.fillStyle='#1a003a';ctx.fillRect(vx,vy,vw,vh);
    pbord(vx,vy,vw,vh,'#5500aa');
    ptc('SUMMONING EROS...',LW/2,LH/2,'#aa44ff',1);
  } else {
    // CRT scanline overlay for extra pixel vibe
    ctx.fillStyle='rgba(0,0,0,0.22)';
    for(let sy=vy;sy<vy+vh;sy+=2)ctx.fillRect(vx,sy,vw,1);
    pbord(vx,vy,vw,vh,'#ffd700');
  }
  // Title bar
  fillR(0,0,LW,26,'#06000e');
  ptc("CUPID'S 21",LW/2,6,'#ff88cc',2);
  ptc('BioCraftEd Jam 2026',LW/2,20,'#5500aa',1);
  // Skip button
  pbtn('SKIP >>',LW-68,LH-14,62,12,G.hBtn==='skip','#3d0077');
  // "click to start" when not yet playing
  if(!G.vidStarted) ptc('CLICK ANYWHERE TO PLAY',LW/2,LH-10,'#ffd700',1);
  drawPts();drawFlt();
}

// ── MENU ─────────────────────────────────────────────────────────
function drawMenu(){
  drawRoom();
  // Draw idle Eros
  drawEros('idle',0);
  // Title overlay
  fillR(60,10,360,20,'#1a003a');pbord(60,10,360,20,'#ffd700');
  ptc("CUPID'S 21",LW/2,14,'#ff88cc',2);
  // Rules panel
  fillR(20,TY+2,440,64,'#06000e');pbord(20,TY+2,440,64,'#5500aa');
  ptc('CLOSEST TO 21 WINS — DRAW OR STAND',LW/2,TY+6,'#ccaaff',1);
  ptc('WILD CARDS:  +5 CURSE  SWAP  SHIELD  STEAL  PEEK',LW/2,TY+16,'#ff88ff',1);
  ptc('LOSE ROUND = EROS SHOOTS AN ARROW',LW/2,TY+26,'#ff4477',1);
  ptc('3 ARROWS = GAME OVER',LW/2,TY+36,'#ff4477',1);
  pbtn('> PLAY <',LW/2-55,TY+48,110,13,G.hBtn==='start','#5500aa');
  drawPts();drawFlt();
}

// ── GAME OVER ─────────────────────────────────────────────────────
function drawGameOver(){
  drawRoom();
  const won=G.pLives>0;
  drawEros(won?'hit':'win',40);
  if(!won) drawStuckOnEros(); // shouldn't be here but just in case
  fillR(60,10,360,20,'#1a003a');pbord(60,10,360,20,won?'#ff4477':'#aa44ff');
  ptc(won?'YOU WIN!':'YOU DIED',LW/2,14,won?'#ff88cc':'#aa44ff',2);
  fillR(20,TY+2,440,64,'#06000e');pbord(20,TY+2,440,64,won?'#ff4477':'#aa44ff');
  ptc(won?'EROS IS DEFEATED!':'CUPID FELL.',LW/2,TY+8,'#ffd700',2);
  ptc(won?'LOVE PREVAILS':'EROS LAUGHS AT YOU',LW/2,TY+24,'#664488',1);
  ptc('LIVES: '+G.pLives+'/3  ARROWS HIT: '+(3-G.pLives),LW/2,TY+36,'#ff4477',1);
  pbtn('> PLAY AGAIN <',LW/2-55,TY+48,110,13,G.hBtn==='restart','#5500aa');
  drawPts();drawFlt();
}

// ── INPUT ─────────────────────────────────────────────────────────
C.addEventListener('click',e=>{
  initAC();
  const r=C.getBoundingClientRect(),s=C._s||1;
  const mx=(e.clientX-r.left)/s,my=(e.clientY-r.top)/s;
  const b=btnAt(mx,my);
  if(G.phase==='intro'){
    if(b==='skip'||G.vidStarted){VID.pause();G.phase='menu';}  // skip or re-click → go to menu
    else{G.vidStarted=true;startVideo();}
  }
  if(G.phase==='menu')    {if(b==='start')  newGame();}
  if(G.phase==='gameover'){if(b==='restart')G.phase='menu';}
  if(b==='draw') actDraw();
  if(b==='stand')actStand();
});
C.addEventListener('mousemove',e=>{
  const r=C.getBoundingClientRect(),s=C._s||1;
  const mx=(e.clientX-r.left)/s,my=(e.clientY-r.top)/s;
  G.hBtn=btnAt(mx,my);C.style.cursor=G.hBtn?'pointer':'default';
});

// ── MAIN LOOP ─────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  G.frame++;G.pStateF++;G.oStateF++;
  tickPts();tickFlt();tickArrow();
  if(G.msgT>0)G.msgT--;if(screenShake>0)screenShake--;
  if(G.pState==='draw'&&G.pStateF>18){G.pState='idle';G.pStateF=0;}
  if(G.oState==='draw'&&G.oStateF>18){G.oState='idle';G.oStateF=0;}
  if(G.pState==='hit' &&G.pStateF>35){G.pState='idle';G.pStateF=0;}
  if(G.oState==='hit' &&G.oStateF>35){G.oState='idle';G.oStateF=0;}
  if(G.pState==='win' &&G.pStateF>55){G.pState='idle';G.pStateF=0;}
  if(G.oState==='win' &&G.oStateF>55){G.oState='idle';G.oStateF=0;}
  if(G.phase==='opp')oppTick();
  if(G.phase==='intro')  {drawIntro();  return;}
  if(G.phase==='menu')   {drawMenu();   return;}
  if(G.phase==='gameover'){drawGameOver();return;}

  // Screen shake
  const sx=screenShake>0?(Math.random()-.5)*6|0:0;
  const sy=screenShake>0?(Math.random()-.5)*4|0:0;
  ctx.save();ctx.translate(sx,sy);

  drawRoom();
  drawEros(G.oState,G.oStateF);
  drawStuckOnEros();
  drawHands();

  // Arrow animation
  if(ARW&&!ARW.done){
    if(ARW.fromRight)drawIncomingArrow(ARW.t);
    else             drawOutgoingArrow(ARW.t);
  }

  drawStuckOnPlayer();
  drawHUD();
  getBtns().forEach(b=>pbtn(b.label,b.x,b.y,b.w,b.h,G.hBtn===b.id,b.col));
  drawFlt();drawPts();
  ctx.restore();
}

setInterval(()=>{if(G.phase==='menu'||G.phase==='gameover'){spark(80+Math.random()*320|0,Math.random()*130|0,2,Math.random()>.5?'#ff4488':'#aa44ff');}},350);

loop();
</script>
